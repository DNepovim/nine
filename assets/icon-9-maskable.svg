<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Maskable variant: same gradient, smaller glyph so it survives the safe-zone
       crop (content must sit inside the central 80% circle). -->
  <defs>
    <linearGradient id="nine" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4C7EFF"/>
      <stop offset="0.34" stop-color="#7273D2"/>
      <stop offset="0.67" stop-color="#c36282"/>
      <stop offset="1" stop-color="#E5534B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#nine)"/>
  <text x="256" y="256" fill="#ffffff"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700"
        font-size="280" text-anchor="middle" dominant-baseline="central">9</text>
</svg>
