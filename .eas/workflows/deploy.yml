name: Deploy web to EAS Hosting

# Production is never deployed by a push. This workflow is manual only, and the
# way it is normally reached is .github/workflows/deploy.yml — a dispatch there
# runs the static suite and the audit first and only creates this run once both
# are green. Running it straight from the CLI
# (`eas workflow:run .eas/workflows/deploy.yml --ref main`) bypasses that gate;
# that is the emergency path, and the `deploy` skill checks by hand before taking
# it. Either way it takes a person: landing on `main` and shipping to players are
# two separate decisions, and this is where the second one is made.
on:
  workflow_dispatch: {}

# A second run started while a deploy is still going makes the first one obsolete —
# and worse, whichever finishes last is what production serves, so an older commit can
# land on top of a newer one. The newer run cancels the older instead. `group` does
# nothing yet (EAS does not support custom concurrency groups), but the docs ask for it
# so this keeps working once it does.
concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}

# The Lingui CLI is ESM-only and needs Node 22.19+ — it calls `fs.globSync`, which does
# not exist before Node 22. EAS images default to Node 20, so `pnpm i18n:compile` failed
# on the first deploy that ran it. `22` is nvm syntax for the latest 22.x, which keeps
# this on an LTS major rather than following `latest` onto whatever ships next.
defaults:
  tools:
    node: 22

# The static gate — lint, Prettier, types, Knip, tests, i18n — and the dependency
# audit both live in GitHub Actions, where the minutes are free: checks.yml holds
# the suite, deploy.yml runs it and the audit as the gate in front of this. EAS
# runs only what needs EAS: the two steps below that hold the project's env vars.
# Nothing here re-checks the ref, so a run created by any other means is trusted.
jobs:
  deploy:
    name: Deploy to production
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Env vars
        # Fails before the expensive build rather than mid-build if the
        # EXPO_PUBLIC_* values are missing from the EAS environment.
        run: pnpm check-env
      - name: Build web (export + service worker)
        run: pnpm run build:web
      - name: Deploy to EAS Hosting (production)
        run: pnpm dlx eas-cli@latest deploy --prod --non-interactive
