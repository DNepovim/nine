name: Preview deploy

# Every pull request gets its own preview URL at nine--pr-<number>.expo.app.
# The alias is re-assigned on each run, so the link stays the same for the life
# of the PR and always shows the latest push. Never passes --prod, so production
# is only ever touched by deploy.yml, which nothing triggers but a person.
#
# The static gate runs in parallel over in GitHub Actions
# (.github/workflows/checks.yml) rather than here — EAS compute is metered and
# those steps are the slow half of CI. So a preview can go up while the checks
# are still red; the PR shows both, and the checks are what blocks the merge.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

# The Lingui CLI is ESM-only and needs Node 22.19+ — it calls `fs.globSync`, which does
# not exist before Node 22. EAS images default to Node 20, so `pnpm i18n:compile` failed
# on the first deploy that ran it. `22` is nvm syntax for the latest 22.x, which keeps
# this on an LTS major rather than following `latest` onto whatever ships next.
defaults:
  tools:
    node: 22

jobs:
  deploy:
    name: Deploy preview
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Env vars
        # Fails loudly if the EXPO_PUBLIC_* vars are missing, rather than shipping
        # a preview that builds fine but points at nothing.
        run: pnpm check-env
      - name: Build web (export + service worker)
        run: pnpm run build:web
      - name: Deploy to EAS Hosting (preview)
        run: pnpm dlx eas-cli@latest deploy --alias pr-${{ github.event.pull_request.number }} --non-interactive
